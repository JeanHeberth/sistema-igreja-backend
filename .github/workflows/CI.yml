name: CI - Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  test-resource:
    name: Testes Resource
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Resource
        run: ./gradlew test --no-daemon --tests "*ResourceTest"

      - name: Publicar relatório de testes Resource
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-resource
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

  test-service:
    name: Testes Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-resource

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Service
        run: ./gradlew test --no-daemon --tests "*ServiceTest"

      - name: Publicar relatório de testes Service
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-service
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-resource, test-service]

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Gerar cobertura consolidada
        run: ./gradlew clean test jacocoTestReport --no-daemon

      - name: Verificar arquivos JaCoCo
        run: |
          echo "=== build/reports/jacoco/test ==="
          ls -R build/reports/jacoco/test || true

      - name: Publicar cobertura no PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          title: "Cobertura Total JaCoCo"

      - name: Gerar badge de coverage
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: badges
          generate-branches-badge: true

      - name: Commit badge no repositório
        if: github.ref == 'refs/heads/main'
        uses: EndBug/add-and-commit@v9
        with:
          add: 'badges/*.svg'
          message: 'chore(ci): atualiza badges de coverage'

      - name: Publicar relatório JaCoCo consolidado
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report-total
          path: |
            build/reports/jacoco/
            badges/
          if-no-files-found: warn