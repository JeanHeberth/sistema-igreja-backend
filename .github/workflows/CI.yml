name: CI - Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Resource
        run: ./gradlew test --no-daemon --tests "*ResourceTest"

      - name: Gerar relatório JaCoCo Resource
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Publicar relatório Resource
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-resource
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: warn
  test-service:
    needs: test-resource
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Service
        run: ./gradlew test --no-daemon --tests "*ServiceTest"

      - name: Gerar relatório JaCoCo Service
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Publicar relatório Service
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-service
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
          if-no-files-found: warn
