name: CI - Tests

on:
  push:
    branches:
       [develop, main]
  pull_request:
    branches:
       [main, develop]

jobs:
  test-resource:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes do Resource
        run: ./gradlew clean test --no-daemon --tests "com.igreja.adapters.web.resource.*"

  test-service:
    runs-on: ubuntu-latest
    needs: test-resource

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes do Service
        run: ./gradlew clean test --no-daemon --tests "com.igreja.application.service.*"
