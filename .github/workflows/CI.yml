name: CI - Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Limpar e compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Resource
        run: ./gradlew test --no-daemon --tests "*ResourceTest"

      - name: Rodar testes Service
        run: ./gradlew test --no-daemon --tests "*ServiceTest"

      - name: Gerar relatório JaCoCo
        if: always()
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/
          if-no-files-found: warn