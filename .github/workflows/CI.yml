name: CI - Tests

on:
  push:
    branches:
       [develop, main]
  pull_request:
    branches:
       [main, develop]

jobs:
  test-resource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes Resource
        run: ./gradlew clean test --no-daemon --tests '*Resource*'

  test-service:
    runs-on: ubuntu-latest
    needs: test-resource
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes Service
        run: ./gradlew clean test --no-daemon --tests '*Service*'

      # Notificação por e-mail em caso de falha de testes (desabilitado por enquanto)
      # - name: Enviar e-mail se testes falharem
      #   if: failure()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     # servidor SMTP (exemplo: Gmail)
      #     server_address: ${{ secrets.SMTP_SERVER }}
      #     server_port: ${{ secrets.SMTP_PORT }}
      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}
      #     subject: "[CI] Falha nos testes - ${{ github.repository }} - ${{ github.ref_name }}"
      #     from: ${{ secrets.SMTP_FROM }}
      #     to: ${{ secrets.TESTS_ALERT_EMAIL }}
      #     secure: true
      #     priority: high
      #     body: |
      #       Os testes falharam no workflow GitHub Actions.
      #
      #       Repositório: ${{ github.repository }}
      #       Branch/Ref:  ${{ github.ref_name }}
      #       Evento:      ${{ github.event_name }}
      #       Run:         https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      #
      #       Verifique os logs em "Rodar testes" para mais detalhes.
      - name: Rodar testes do Resource
        run: ./gradlew clean test --no-daemon --tests "com.igreja.adapters.web.resource.*"

  test-service:
    runs-on: ubuntu-latest
    needs: test-resource

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes do Service
        run: ./gradlew clean test --no-daemon --tests "com.igreja.application.service.*"
