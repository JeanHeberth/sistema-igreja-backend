name: CI - Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  test-resource:
    name: Testes Resource
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Limpar e compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Resource
        run: ./gradlew test --no-daemon --tests "*ResourceTest"

      - name: Verificar arquivos JaCoCo gerados
        if: always()
        run: |
          echo "=== build/reports/jacoco ==="
          ls -R build/reports/jacoco || true
          echo "=== build/jacoco ==="
          ls -R build/jacoco || true

      - name: Publicar relatório de testes Resource
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-resource
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

      - name: Publicar relatório JaCoCo Resource
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report-resource
          path: |
            build/reports/jacoco/
          if-no-files-found: warn

      - name: Publicar cobertura Resource no PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Cobertura JaCoCo - Resource"
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  test-service:
    name: Testes Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-resource

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Limpar e compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Service
        run: ./gradlew test --no-daemon --tests "*ServiceTest"

      - name: Verificar arquivos JaCoCo gerados
        if: always()
        run: |
          echo "=== build/reports/jacoco ==="
          ls -R build/reports/jacoco || true
          echo "=== build/jacoco ==="
          ls -R build/jacoco || true

      - name: Publicar relatório de testes Service
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-service
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

      - name: Publicar relatório JaCoCo Service
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report-service
          path: |
            build/reports/jacoco/
          if-no-files-found: warn

      - name: Publicar cobertura Service no PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Cobertura JaCoCo - Service"
          min-coverage-overall: 0
          min-coverage-changed-files: 0