name: CI - Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:

  test-resource:
    name: Testes Resource
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Resource
        run: ./gradlew test --no-daemon --tests "*ResourceTest"

      - name: Upload cobertura Resource
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-resource
          path: build/reports/jacoco/test/jacocoTestReport.xml


  test-service:
    name: Testes Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-resource

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Permissão para gradlew
        run: chmod +x ./gradlew

      - name: Compilar classes de teste
        run: ./gradlew clean testClasses --no-daemon

      - name: Rodar testes Service
        run: ./gradlew test --no-daemon --tests "*ServiceTest"

      - name: Upload cobertura Service
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-service
          path: build/reports/jacoco/test/jacocoTestReport.xml


  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-resource, test-service]

    steps:

      - name: Checkout código
        uses: actions/checkout@v5

      - name: Download cobertura Resource
        uses: actions/download-artifact@v5
        with:
          name: jacoco-resource
          path: coverage/resource

      - name: Download cobertura Service
        uses: actions/download-artifact@v5
        with:
          name: jacoco-service
          path: coverage/service

      - name: Gerar comentário único de cobertura
        uses: madrapps/jacoco-report@v1.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: |
            coverage/resource/jacocoTestReport.xml
            coverage/service/jacocoTestReport.xml
          title: "Cobertura Total JaCoCo"

      - name: Gerar badge de coverage
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: badges
          generate-branches-badge: true

      - name: Commit badge no repositório
        uses: EndBug/add-and-commit@v9
        with:
          add: 'badges/*.svg'
          message: 'Atualiza badge de coverage'